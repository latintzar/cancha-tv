name: Android TV native capture
on:
  push:
    branches: [capture/android-tv]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m pip install -r server/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build native Android TV app against its local proof server
        working-directory: android
        run: bash ./gradlew :app:assembleDebug -PcanchaBaseUrl=http://10.0.2.2:8765
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual app on Android TV with three authored signals
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          script: bash tools/android-tv-capture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cancha-android-tv-proof
          path: capture/
          if-no-files-found: warn
