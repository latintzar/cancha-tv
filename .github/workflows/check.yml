name: Cancha source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r server/requirements.txt
      - run: python3 -m pip check
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/source-reference.py
      - run: python3 tools/link-gate.py
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 -m pip install playwright==1.62.0
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tools/first-signal.py --capture /tmp/cancha-native-proof
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile original TV app with recipient endpoint
        working-directory: android
        run: bash ./gradlew :app:assembleDebug -PcanchaBaseUrl=https://your-cancha.example
